name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdk:
    name: Build & test (CDK / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile
        run: npm run build

      - name: Unit tests
        run: npm test

  lambda:
    name: Lint & test (vpn_toggle / Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no bare major tag (v9.0.0 exists, v9 does not).
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.11'

      - name: Lint
        run: uvx ruff check src/vpn_toggle tests

      # Bypasses Poetry/poetry.lock entirely (mirrors the Lambda layer's runtime deps)
      # and mocks all AWS calls via moto - no real credentials or network access needed.
      - name: Unit tests
        run: |
          uv run --no-project --python 3.11 \
            --with boto3 --with pydantic --with urllib3 --with pytest \
            --with 'moto[ec2,autoscaling,cloudwatch,sns,sqs,route53]' \
            pytest tests/ -v
